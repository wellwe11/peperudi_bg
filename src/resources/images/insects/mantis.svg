<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420">
  <defs>
    <g id="mantis-foreleg-r">
      <path d="M162 100
        C 190 92, 215 100, 228 120
        C 216 118, 200 122, 188 132
        C 178 122, 168 112, 158 108
        Z"/>
    </g>
    <g id="mantis-midleg-r">
      <path d="M170 190 L 220 210 M172 215 L 225 240" stroke="#6f6c66" stroke-width="5" fill="none" stroke-linecap="round"/>
    </g>
    <g id="mantis-backleg-r">
      <path d="M168 240 L 210 275 M166 260 L 205 300" stroke="#6f6c66" stroke-width="5" fill="none" stroke-linecap="round"/>
    </g>
  </defs>
  <g fill="#6f6c66">
    <!-- triangular head -->
    <path d="M150 40 L 172 68 L 150 85 L 128 68 Z"/>
    <circle cx="138" cy="62" r="6" fill="#54524d" opacity="0.55"/>
    <circle cx="162" cy="62" r="6" fill="#54524d" opacity="0.55"/>
    <path d="M144 42 C 132 28, 118 20, 105 16" stroke="#6f6c66" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M156 42 C 168 28, 182 20, 195 16" stroke="#6f6c66" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- neck/thorax elongated -->
    <path d="M141 82 L 159 82 L 165 190 L 135 190 Z"/>
    <!-- folded raptorial forelegs -->
    <use href="#mantis-foreleg-r"/>
    <use href="#mantis-foreleg-r" transform="translate(300,0) scale(-1,1)"/>
    <!-- wings/abdomen -->
    <path d="M135 185
      C 122 220, 122 270, 135 320
      C 143 350, 150 365, 150 365
      C 150 365, 157 350, 165 320
      C 178 270, 178 220, 165 185
      Z"/>
    <line x1="150" y1="190" x2="150" y2="360" stroke="#54524d" stroke-width="2.5" opacity="0.4"/>
    <path d="M138 230 C 145 234, 155 234, 162 230 M136 270 C 145 275, 155 275, 164 270 M138 310 C 145 314, 155 314, 162 310"
      stroke="#54524d" stroke-width="2" fill="none" opacity="0.35"/>
    <use href="#mantis-midleg-r"/>
    <use href="#mantis-midleg-r" transform="translate(300,0) scale(-1,1)"/>
    <use href="#mantis-backleg-r"/>
    <use href="#mantis-backleg-r" transform="translate(300,0) scale(-1,1)"/>
  </g>
</svg>
